name: CI/CD Pipeline with ChatOps and AWS Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Notify Slack - CI Result
        if: always()
        run: |
          STATUS="✅ CI Passed"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ CI Failed"
          fi

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"$STATUS for \`${{ github.repository }}\` — commit ${{ github.sha }} by ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://devops-webapp-1786911663 --delete

      - name: Notify Slack - Deployment Result
        if: always()
        run: |
          STATUS="✅ Deployed successfully"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ Deployment failed"
          fi

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"$STATUS — S3 bucket: devops-webapp-1786911663\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
